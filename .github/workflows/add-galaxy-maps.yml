name: Add Galaxy gate maps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-galaxy-maps.yml'
      - 'scripts/add_galaxy_maps.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Galaxy maps and routing
        run: python3 scripts/add_galaxy_maps.py

      - name: Commit Galaxy map preparation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data.js src/screens/world.js; then
            echo 'Galaxy map preparation already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data.js src/screens/world.js
          git commit -m 'feat: prepare Galaxy hub and four submaps'
          git push
